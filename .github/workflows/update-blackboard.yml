name: Update Blackboard (黑板报)

on:
  schedule:
    # 工作日 01:00 UTC = 北京时间 09:00，周一至周五
    - cron: "0 1 * * 1-5"
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update-blackboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's blackboard
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/update_blackboard.py

      - name: Regenerate static site
        run: python scripts/generate_site.py

      - name: Commit changes if any
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.en.md docs/blackboard docs/blackboard.html docs/index.html
            git commit -m "docs: 黑板报出刊（$(TZ=Asia/Shanghai date +%Y-%m-%d)）"
            git push
          else
            echo "No changes to commit"
          fi

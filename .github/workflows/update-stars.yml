name: Update Star Counts

on:
  schedule:
    # 每天 16:00 UTC = 北京时间 0:00
    - cron: "0 16 * * *"
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stars and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stars.py

      - name: Regenerate static site
        run: python scripts/generate_site.py

      - name: Commit changes if any
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.en.md docs/index.html
            git commit -m "docs: 自动更新 Star 数（$(TZ=Asia/Shanghai date +%Y-%m-%d)）"
            git push
          else
            echo "No changes to commit"
          fi
